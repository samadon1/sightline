fill="#eee">Character 6</text><text x="1250" y="146" text-anchor="middle" font-size="11" fill="#999">#E517E5</text><text x="60" y="200" font-size="12" fill="#bbb">Assignment order follows cue count per character; opposite pairs (dashed) go to characters who share scenes most. Twelve supporting shades sit between these; minor roles take pastel HSB(h, 30%, 90%). White 90% is the read-ahead line.</text><text x="60" y="222" font-size="12" fill="#bbb">The viewer's own caption colour always wins over all of this on the native path.</text></svg>