78">timing, loudness,</text><text x="232.0" y="196" text-anchor="middle" font-size="10.5" font-weight="400" fill="#687078">faces, sounds</text><rect x="340" y="90" width="64" height="64" rx="6" fill="#ED7100"/><g transform="translate(340,90) scale(1.0)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18h12l10 14h16M14 32h22M14 46h12l10-14"/><path d="M48 28l4 4-4 4"/></g><circle cx="402" cy="92" r="10" fill="#232F3E" stroke="#fff" stroke-width="2"/><text x="402" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text><text x="372.0" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Propose</text><text x="372.0" y="183" text-anchor="middle" font-size="10.5" font-weight="400" fill="#687078">one file of proposals</text><path d="M124 122h72" fill="none" stroke="#232F3E" stroke-width="1.3" marker-end="url(#ah)"/><path d="M264 122h72" fill="none" stroke="#232F3E" stroke-width="1.3" marker-end="url(#ah)"/><rect x="340" y="260" width="64" height="64" rx="6" fill="#7AA116"/><g transform="translate(340,260) scale(1.0)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="22" r="7"/><path d="M12 48c0-9 6-14 14-14s14 5 14 14"/><path d="M40 34l5 5 9-11"/></g><circle cx="402" cy="262" r="10" fill="#232F3E" stroke="#fff" stroke-width="2"/><text x="402" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text><text x="372.0" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Review</text><text x="372.0" y="353" text-anchor="middle" font-size="10.5" font-weight="400" fill="#687078">a person confirms</text><path d="M356 158v98" fill="none" stroke="#232F3E" stroke-width="1.3" marker-end="url(#ah)"/><rect x="270.8" y="202" width="58.4" height="14" fill="#fff"/><text x="300" y="213" text-anchor="middle" font-size="10.5" font-weight="600" fill="#232F3E">proposals</text><rect x="60" y="400" width="64" height="64" rx="6" fill="#01A88D"/><g transform="translate(60,400) scale(1.0)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="26" y="12" width="12" height="22" rx="6"/><path d="M18 28c0 8 6 14 14 14s14-6 14-14M32 42v8M24 50h16"/></g><circle cx="122" cy="402" r="10" fill="#232F3E" stroke="#fff" stroke-width="2"/><text x="122" y="406" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text><text x="92.0" y="480" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Second opinion</text><text x="92.0" y="493" text-anchor="middle" font-size="10.5" font-weight="400" fill="#687078">transcribe_aws.py</text><path d="M92 158v238" fill="none" stroke="#232F3E" stroke-width="1.3" marker-end="url(#ah)"/><rect x="109.6" y="272" width="80.8" height="14" fill="#fff"/><text x="150" y="283" text-anchor="middle" font-size="10.5" font-weight="600" fill="#232F3E">audio-16k.wav</text><path d="M110 396V380H388V328" fill="none" stroke="#232F3E" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="116.4" y="360" width="187.2" height="14" fill="#fff"/><text x="210" y="371" text-anchor="middle" font-size="10.5" font-weight="600" fill="#232F3E">proposed timings + speaker turns</text><rect x="340" y="520" width="64" height="64" rx="6" fill="#527FFF"/><g transform="translate(340,520) scale(1.0)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 12h20l10 10v30H18z"/><path d="M38 12v10h10M24 30h16M24 38h16M24 46h10"/></g><circle cx="402" cy="522" r="10" fill="#232F3E" stroke="#fff" stroke-width="2"/><text x="402" y="526" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text><text x="372.0" y="600" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Verified companion</text><text x="372.0" y="613" text-anchor="middle" font-size="10.5" font-weight="400" fill="#687078">+ captions.en.vtt + HLS</text><path d="M356 328v188" fill="none" stroke="#232F3E" stroke-width="1.3" marker-end="url(#ah)"/><text x="60" y="552" font-size="10.5" fill="#687078">Transcribe never writes caption text.</text><text x="60" y="566" font-size="10.5" fill="#687078">Only timing and speaker labels carry</text><text x="60" y="580" font-size="10.5" fill="#687078">over, and always as proposals. Where</text><text x="60" y="594" font-size="10.5" fill="#687078">WhisperX and Transcribe agree a person</text><text x="60" y="608" font-size="10.5" fill="#687078">confirms fast; where they disagree the</text><text x="60" y="622" font-size="10.5" fill="#687078">cue goes to the top of the review queue.</text><rect x="530" y="40" width="500" height="590" rx="2" fill="#F7F8FA" stroke="#232F3E" stroke-width="1.2"/><text x="542" y="60" font-size="13" font-weight="600" fill="#232F3E">AWS, us-east-1</text><text x="542" y="76" font-size="11" fill="#687078">one account, three services, cents a month</text><rect x="620" y="120" width="64" height="64" rx="6" fill="#7AA116"/><g transform="translate(620,120) scale(1.0)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18c0-4 32-4 32 0v4c0 4-32 4-32 0z"/><path d="M16 22l3 24c0 4 26 4 26 0l3-24"/><path d="M20 34c4 3 20 3 24 0"/></g><circle cx="682" cy="122" r="10" fill="#232F3E" stroke="#fff" stroke-width="2"/><text x="682" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">7</text><text x="652.0" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Amazon S3</text><text x="652.0" y="213" text-anchor="middle" font-size="10.5" font-weight="400" fill="#687078">private bucket</text><rect x="850" y="120" width="64" height="64" rx="6" fill="#8C4FFF"/><g transform="translate(850,120) scale(1.0)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="16"/><path d="M16 32h32M32 16c6 6 6 26 0 32M32 16c-6 6-6 26 0 32M20 22c6 3 18 3 24 0M20 42c6-3 18-3 24 0"/></g><circle cx="912" cy="122" r="10" fill="#232F3E" stroke="#fff" stroke-width="2"/><text x="912" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">8</text><text x="882.0" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Amazon CloudFront</text><text x="882.0" y="213" text-anchor="middle" font-size="10.5" font-weight="400" fill="#687078">origin access control, HTTPS only</text><rect x="680" y="400" width="64" height="64" rx="6" fill="#01A88D"/><g transform="translate(680,400) scale(1.0)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 32h6l4-12 5 24 5-20 5 14 4-6h11"/></g><circle cx="742" cy="402" r="10" fill="#232F3E" stroke="#fff" stroke-width="2"/><text x="742" y="406" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">9</text><text x="712.0" y="480" text-anchor="middle" font-size="12" font-weight="600" fill="#232F3E">Amazon Transcribe</text><text x="712.0" y="493" text-anchor="middle" font-size="10.5" font-weight="400" fill="#687078">speaker labels, en-US,</text><text x="712.0" y="506" text-anchor="middle" font-size="10.5" font-weight="400" fill="#687078">reads the audio from the bucket</text><path d="M684 152h162" fill="none" stroke="#232F3E" stroke-width="1.3" marker-end="url(#ah)"/><rect x="738.6" y="132" width="52.8" height="14" fill="#fff"/><text x="765" y="143" text-anchor="middle" font-size="10.5" font-weight="600" fill="#232F3E">OAC read</text><text x="615" y="250" font-size="10.5" fill="#687078" font-family="Menlo,Consolas,monospace">&lt;scene&gt;/captions.en.vtt</text><text x="615" y="264" font-size="10.5" fill="#687078" font-family="Menlo,Consolas,monospace">&lt;scene&gt;/companion.en.json</text><text x="615" y="278" font-size="10.5" fill="#687078" font-family="Menlo,Consolas,monospace">&lt;scene&gt;/hls/&lt;name&gt;.m3u8, .m4s</text><text x="615" y="292" font-s