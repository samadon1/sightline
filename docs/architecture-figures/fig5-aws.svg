="#687078">is ever drawn</text><text x="1100" y="470" font-size="10.5" fill="#687078">Fetched from the distribution at load:</text><text x="1100" y="484" font-size="10.5" fill="#687078">the HLS manifest and segments,</text><text x="1100" y="498" font-size="10.5" fill="#687078">captions.en.vtt, companion.en.json.</text><text x="1100" y="512" font-size="10.5" fill="#687078"></text><text x="1100" y="526" font-size="10.5" fill="#687078">Device log, September 4:</text><text x="1100" y="545" font-size="10.5" fill="#687078" font-family="Menlo,Consolas,monospace">[player] source=server</text><text x="1100" y="559" font-size="10.5" fill="#687078" font-family="Menlo,Consolas,monospace">  host=https://dezgz...cloudfront.net</text><text x="1100" y="573" font-size="10.5" fill="#687078" font-family="Menlo,Consolas,monospace">[assets] source=remote vtt=1275B</text><text x="1100" y="587" font-size="10.5" fill="#687078" font-family="Menlo,Consolas,monospace">  companion=yes in 901 ms</text></svg>